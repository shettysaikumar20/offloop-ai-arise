<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050918"/>
      <stop offset="50%" stop-color="#0a1230"/>
      <stop offset="100%" stop-color="#060a1a"/>
    </linearGradient>

    <linearGradient id="xpBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-hud-header { font-family: 'Segoe UI', -apple-system, monospace; font-size: 13px; font-weight: 800; fill: #38bdf8; letter-spacing: 3px; }
    .font-name { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
    .font-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #c084fc; font-weight: 600; }
    .font-stat-label { font-family: monospace; font-size: 13px; font-weight: 700; fill: #94a3b8; }
    .font-stat-val { font-family: monospace; font-size: 18px; font-weight: 900; fill: #ffffff; }
    .font-metric-num { font-family: monospace; font-size: 22px; font-weight: 900; fill: #38bdf8; }
    .font-metric-lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #64748b; text-transform: uppercase; font-weight: 600; }
  </style>

  <!-- Deep Obsidian Container -->
  <rect x="0" y="0" width="950" height="480" rx="14" fill="url(#panelBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Top Decorative Luminous Line -->
  <line x1="80" y1="2" x2="870" y2="2" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonBlue)"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 930 40 L 930 20 L 910 20" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 20 440 L 20 460 L 40 460" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M 930 440 L 930 460 L 910 460" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- Header Section -->
  <g transform="translate(36, 40)">
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#0b1739" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="17" text-anchor="middle" class="font-hud-header">[ STATUS WINDOW ]</text>

    <!-- Hunter ID & Name -->
    <text x="0" y="65" class="font-name">SUNG JIN-WOO (PLAYER)</text>
    <text x="0" y="90" class="font-title">TITLE: <tspan fill="#e2e8f0">The Reawakened One</tspan>  •  JOB: <tspan fill="#38bdf8">None (Pre-Monarch)</tspan></text>
  </g>

  <!-- Top Right Rank Diamond -->
  <g transform="translate(830, 80)">
    <rect x="-45" y="-45" width="90" height="90" rx="12" fill="#0f1b3e" stroke="#94a3b8" stroke-width="2" filter="url(#neonBlue)"/>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="34" font-weight="900" fill="#94a3b8">E</text>
    <text x="0" y="28" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">RANK</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="145" x2="914" y2="145" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Level & XP Section -->
  <g transform="translate(36, 175)">
    <text x="0" y="0" font-family="monospace" font-size="18" font-weight="900" fill="#f8fafc">
      LEVEL <tspan fill="#38bdf8" filter="url(#neonBlue)">01</tspan>
    </text>
    <text x="878" y="0" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#94a3b8">
      EXP: <tspan fill="#38bdf8">45</tspan> / 100 (45%)
    </text>

    <!-- XP Bar Track -->
    <rect x="0" y="12" width="878" height="12" rx="6" fill="#080e22" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="0" y="12" width="395" height="12" rx="6" fill="url(#xpBarGrad)" filter="url(#neonBlue)"/>
  </g>

  <!-- Attributes Grid (Left Column: STR & INT | Right Column: DIS & END) -->
  <g transform="translate(36, 235)">
    <!-- STR Box -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="425" height="52" rx="8" fill="#070d24" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="26" r="14" fill="#1b1410" stroke="#f97316" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" font-family="sans-serif" font-size="14">🔥</text>
      <text x="54" y="24" class="font-stat-label">STRENGTH (STR)</text>
      <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#64748b">Physical stamina &amp; workouts</text>
      <text x="400" y="33" text-anchor="end" class="font-stat-val" fill="#f97316">10</text>
    </g>

    <!-- INT Box -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="425" height="52" rx="8" fill="#070d24" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="26" r="14" fill="#0a1928" stroke="#38bdf8" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" font-family="sans-serif" font-size="14">✨</text>
      <text x="54" y="24" class="font-stat-label">INTELLIGENCE (INT)</text>
      <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#64748b">Deep study, synthesis &amp; books</text>
      <text x="400" y="33" text-anchor="end" class="font-stat-val" fill="#38bdf8">10</text>
    </g>

    <!-- DIS Box -->
    <g transform="translate(453, 0)">
      <rect x="0" y="0" width="425" height="52" rx="8" fill="#070d24" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="26" r="14" fill="#1b122c" stroke="#a855f7" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" font-family="sans-serif" font-size="14">🛡️</text>
      <text x="54" y="24" class="font-stat-label">DISCIPLINE (DIS)</text>
      <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#64748b">Digital detox &amp; streak loyalty</text>
      <text x="400" y="33" text-anchor="end" class="font-stat-val" fill="#a855f7">10</text>
    </g>

    <!-- END Box -->
    <g transform="translate(453, 64)">
      <rect x="0" y="0" width="425" height="52" rx="8" fill="#070d24" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="26" r="14" fill="#0a201a" stroke="#10b981" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" font-family="sans-serif" font-size="14">⚡</text>
      <text x="54" y="24" class="font-stat-label">ENDURANCE (END)</text>
      <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#64748b">Sustained flow &amp; focus blocks</text>
      <text x="400" y="33" text-anchor="end" class="font-stat-val" fill="#10b981">10</text>
    </g>
  </g>

  <!-- Bottom Bar: Stat Points Available + Lifetime Stats -->
  <g transform="translate(36, 385)">
    <rect x="0" y="0" width="878" height="60" rx="8" fill="#09102a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Unallocated Points Badge -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#201c0b" stroke="#facc15" stroke-width="1.5" filter="url(#goldGlow)"/>
      <text x="115" y="21" text-anchor="middle" font-family="monospace" font-size="12" font-weight="900" fill="#fef08a">
        ⚡ +3 STAT POINTS READY
      </text>
    </g>

    <!-- Metrics Columns -->
    <g transform="translate(360, 18)">
      <text x="0" y="16" class="font-metric-num">06</text>
      <text x="35" y="15" class="font-metric-lbl">Quests Cleared</text>
    </g>

    <g transform="translate(540, 18)">
      <text x="0" y="16" class="font-metric-num" fill="#a855f7">125m</text>
      <text x="58" y="15" class="font-metric-lbl">Focus Sanctum</text>
    </g>

    <g transform="translate(740, 18)">
      <text x="0" y="16" class="font-metric-num" fill="#f43f5e">03</text>
      <text x="35" y="15" class="font-metric-lbl">Raids Beaten</text>
    </g>
  </g>
</svg>
