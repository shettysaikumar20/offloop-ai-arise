<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#090f24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 900; font-size: 38px; fill: #ffffff; letter-spacing: 6px; }
    .title-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #38bdf8; letter-spacing: 4px; }
    .notice-header { font-family: monospace; font-size: 13px; fill: #c084fc; letter-spacing: 3px; font-weight: 700; }
    .notice-body { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; font-style: italic; }
    .badge-text { font-family: monospace; font-weight: 800; font-size: 12px; fill: #f8fafc; letter-spacing: 1px; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect x="0" y="0" width="950" height="320" rx="16" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Cyber Holographic Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="950" y2="40" />
    <line x1="0" y1="80" x2="950" y2="80" />
    <line x1="0" y1="120" x2="950" y2="120" />
    <line x1="0" y1="160" x2="950" y2="160" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="0" y1="240" x2="950" y2="240" />
    <line x1="0" y1="280" x2="950" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
  </g>

  <!-- Top Glowing Accent Border -->
  <line x1="60" y1="2" x2="890" y2="2" stroke="url(#cyanBlueGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Sci-Fi Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 930 50 L 930 20 L 900 20" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 20 270 L 20 300 L 50 300" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M 930 270 L 930 300 L 900 300" fill="none" stroke="#a855f7" stroke-width="3"/>

  <!-- Center Top Glowing Crest / Emblem -->
  <g transform="translate(475, 48)">
    <polygon points="0,-22 18,0 0,22 -18,0" fill="#0b132e" stroke="#6366f1" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- Main System Title -->
  <text x="475" y="112" text-anchor="middle" class="title-main">
    OFFLOOP AI: <tspan fill="#38bdf8" filter="url(#softGlow)">ARISE</tspan>
  </text>

  <!-- Tagline -->
  <text x="475" y="142" text-anchor="middle" class="title-sub">
    YOUR REAL LIFE IS YOUR DUNGEON.
  </text>

  <!-- System Holographic Notice Box -->
  <rect x="140" y="172" width="670" height="74" rx="8" fill="#070c1e" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <text x="475" y="196" text-anchor="middle" class="notice-header">
    [ SYSTEM NOTICE: A SPATIAL RIFT HAS OPENED IN REALITY ]
  </text>
  
  <text x="475" y="224" text-anchor="middle" class="notice-body">
    "Passive scrolling drains mana. Procrastination is a D-Rank beast. Engage physical quests to ascend."
  </text>

  <!-- Bottom Rank HUD Quick Badges -->
  <g transform="translate(195, 268)">
    <!-- Badge 1: System Online -->
    <rect x="0" y="0" width="130" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#22c55e" filter="url(#softGlow)"/>
    <text x="70" y="18" text-anchor="middle" class="badge-text" fill="#38bdf8">SYSTEM ONLINE</text>

    <!-- Badge 2: E -> S Rank -->
    <rect x="145" y="0" width="130" height="28" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="210" y="18" text-anchor="middle" class="badge-text" fill="#c084fc">E ➔ S MONARCH</text>

    <!-- Badge 3: Desktop Web -->
    <rect x="290" y="0" width="130" height="28" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="355" y="18" text-anchor="middle" class="badge-text" fill="#818cf8">REACT 19 + VITE</text>

    <!-- Badge 4: Local First -->
    <rect x="435" y="0" width="130" height="28" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="500" y="18" text-anchor="middle" class="badge-text" fill="#34d399">ZERO BACKEND</text>
  </g>
</svg>
