services:
  - type: web
    name: offloop-ai-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AI_PROVIDER
        value: fallback
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
      - key: OVERPASS_TIMEOUT_SECONDS
        value: "25"
      - key: HOSTED_GEMMA_ENDPOINT
        sync: false
      - key: HOSTED_GEMMA_API_KEY
        sync: false
      - key: HOSTED_GEMMA_MODEL
        value: google/gemma-2-9b-it
      - key: ELEVENLABS_API_KEY
        sync: false
